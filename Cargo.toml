[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "masonry_raw_box",
    "velona",
    "velona_core",
    "velona_core_child",
    "velona_renderer",
    "velona_renderer_vello"
]
default-members = ["velona"]
resolver = "3"

[workspace.dependencies]
accesskit_winit = "0.33"
any_spawner = "0.3"
async-task = "4"
# TODO update to 0.5 if released
masonry = { version = "0.4", git = "https://github.com/tonymushah/xilem.git", default-features = false, branch = "property-stack-mutator" }
masonry_imaging = { version = "0.4", git = "https://github.com/tonymushah/xilem.git", default-features = false, branch = "property-stack-mutator" }
masonry_core = { version = "0.4", git = "https://github.com/tonymushah/xilem.git", default-features = false, branch = "property-stack-mutator" }
masonry_testing = { version = "0.4", git = "https://github.com/tonymushah/xilem.git", default-features = false, branch = "property-stack-mutator" }
# TODO update to 0.3
reactive_graph = { version = "0.3.0-beta2" }
thiserror = "2"
# TODO update to 0.31 when stable
winit = "0.30"
log = "0.4"
pollster = "1"
# TODO remove this
non-exhaustive = "0.1"
# TODO Remove this in favor of reactive_graph::send_option
send_wrapper = "0.6"
# TODO remove this in favor of atomics counter
uuid = { version = "1" }
ui-events-winit = "0.3"
# parking_lot = "0.12"
copypasta = "0.10.2"
futures-channel = "0.3"
hotpath = { version = "0.23" }
imaging = "0.0.1"
env_logger = "0.11.10"
image = { version = "0.25" }
tokio = { version = "1" }
anyhow = "1"
anyrender_vello = "0.11"
kurbo = { default-features = false, version = "0.13.1" }
peniko = { default-features = false, version = "0.6.1" }
raw-window-handle = "0.6"
imaging_vello = "0.0"
enum_all_variants = "0.2"
resvg = "0.47"
tracing = { version = "0.1.44", default-features = false }
masonry_raw_box = { path = "masonry_raw_box" }
flume = { version = "0.12", default-features = false }
derive_more = { version = "2", default-features = false }

# velona tools
velona_core = { path = "velona_core" }
velona_renderer = { version = "0.1", path = "velona_renderer" }
velona_renderer_vello = { version = "0.1", path = "velona_renderer_vello" }
velona_core_child = { path = "velona_core_child" }
