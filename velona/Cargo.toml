[package]
name = "velona"
version.workspace = true
edition.workspace = true

[dependencies]
masonry.workspace = true
thiserror.workspace = true
log.workspace = true
hotpath = { workspace = true, optional = true }
# TODO add anyrender for rendering simplicity
resvg.workspace = true
velona_core = { workspace = true }
velona_core_child = { workspace = true, features = ["masonry_widget_impls"] }
velona_scoped_styling = { workspace = true }
winit= {workspace = true, default-features = false}
velona_masonry_widgets = { workspace = true }
velona_renderer = { workspace = true }

[features]
default = ["wayland", "wayland-dlopen", "wayland-csd-adwaita", "x11"]
hotpath = ["dep:hotpath", "velona_core/hotpath", "velona_masonry_widgets/hotpath"]
subsecond = ["velona_core/subsecond"]

# winit features
android-game-activity = ["winit/android-game-activity"]
android-native-activity = ["winit/android-native-activity"]
wayland = ["winit/wayland"]
wayland-csd-adwaita = ["winit/wayland-csd-adwaita"]
wayland-csd-adwaita-cosmic-text = ["winit/wayland-csd-adwaita-cosmic-text"]
wayland-csd-adwaita-crossfont = ["winit/wayland-csd-adwaita-crossfont"]
wayland-csd-adwaita-notitle = ["winit/wayland-csd-adwaita-notitle"]
wayland-csd-adwaita-notitlebar = ["winit/wayland-csd-adwaita-notitlebar"]
wayland-csd-adwaita-skrifa = ["winit/wayland-csd-adwaita-skrifa"]
wayland-dlopen = ["winit/wayland-dlopen"]
x11 = ["winit/x11"]
